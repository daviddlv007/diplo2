name: Docker Build & Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: |
          docker build -t miapp-devops .
        env:
          DOCKER_BUILDKIT: 1
      
      - name: Verify Docker image
        run: |
          echo "=== Docker Images ==="
          docker images
          echo ""
          echo "=== Image Details ==="
          docker inspect miapp-devops | head -30
      
      - name: Run container validation
        run: |
          echo "Starting container..."
          docker run -d -p 8080:8080 --name api-test miapp-devops
          
          echo "Waiting for API to be ready..."
          sleep 15
          
          # Check if container is still running
          if docker ps | grep -q api-test; then
            echo "✓ Container is running"
            
            # Get container logs
            echo ""
            echo "=== Container Logs ==="
            docker logs api-test | head -20
            
            echo ""
            echo "✓ Docker image successfully built and validated"
          else
            echo "✗ Container exited"
            docker logs api-test
            exit 1
          fi
          
          # Cleanup
          docker stop api-test 2>/dev/null || true
          docker rm api-test 2>/dev/null || true
