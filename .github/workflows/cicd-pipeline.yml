name: Full CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: miapp-devops
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Build application
        run: dotnet build --configuration Release --no-restore
      
      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

  testing:
    name: Testing Stage
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
          dotnet test --configuration Release --logger "console;verbosity=detailed"
        continue-on-error: true

  delivery:
    name: Delivery - Docker Build
    runs-on: ubuntu-latest
    needs: testing
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
                       -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
                       .
        displayName: 'Build Docker Image'
      
      - name: List Docker Images
        run: |
          echo "=== Available Docker Images ==="
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }}
      
      - name: Validate Docker Image
        run: |
          echo "Inspecting image: ${{ env.DOCKER_IMAGE_NAME }}:latest"
          docker inspect ${{ env.DOCKER_IMAGE_NAME }}:latest | grep -E '"Id"|"Architecture"|"Os"'
      
      - name: Test Docker Container Execution
        run: |
          echo "Starting container test..."
          docker run -d \
            -p 8080:8080 \
            --name devops-test \
            --health-cmd="curl -f http://localhost:8080/health || exit 1" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "Waiting for container to be healthy..."
          sleep 20
          
          if docker ps | grep -q devops-test; then
            echo "✓ Container is running successfully"
            docker logs devops-test | tail -20
          else
            echo "✗ Container failed to start"
            docker logs devops-test
            exit 1
          fi
          
          docker stop devops-test
          docker rm devops-test

  summary:
    name: DevOps Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ci, testing, delivery]
    if: always()
    
    steps:
      - name: Pipeline Completion Report
        run: |
          echo "=== DevOps Pipeline Summary ==="
          echo "Workflow: Full CI/CD Pipeline"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Docker Image: ${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo ""
          echo "Stages Completed:"
          echo "✓ CI (Build & Build tests)"
          echo "✓ Testing (Integration tests)"
          echo "✓ Delivery (Docker build & validation)"
          echo ""
          echo "Pipeline Execution Date: $(date)"
