name: Full CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: miapp-devops
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Build application
        run: |
          echo "=== CI Stage: Building Application ==="
          dotnet build MiApi.csproj --configuration Release --no-restore
          echo "✓ Application built successfully"

  testing:
    name: Testing Stage
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Run Unit Tests (MiApi.Tests)
        run: |
          echo "=== Testing Stage: Running Unit Tests ==="
          dotnet test tests/MiApi.Tests/MiApi.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage"
          echo "✓ Unit tests completed"
      
      - name: Display Unit Test Results
        if: always()
        run: |
          echo "=== Unit Test Results ==="
          if [ -f ./test-results/unit-tests.trx ]; then
            echo "✓ Test results file generated"
            ls -lh ./test-results/
          else
            echo "⚠ No unit test results found"
          fi
      
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/

  delivery:
    name: Delivery - Docker Build
    runs-on: ubuntu-latest
    needs: testing
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Pre-Deployment Test Validation
        run: |
          echo "=== Pre-Deployment Validation ==="
          echo "Running final test validation before Docker build..."
          dotnet test tests/MiApi.Tests/MiApi.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=minimal"
          
          if [ $? -eq 0 ]; then
            echo "✓ All tests passed - Safe to deploy"
          else
            echo "✗ Tests failed - Deployment aborted"
            exit 1
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
                       -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
                       .
      
      - name: List Docker Images
        run: |
          echo "=== Available Docker Images ==="
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }}
      
      - name: Validate Docker Image
        run: |
          echo "Inspecting image: ${{ env.DOCKER_IMAGE_NAME }}:latest"
          docker inspect ${{ env.DOCKER_IMAGE_NAME }}:latest | grep -E '"Id"|"Architecture"|"Os"'
      
      - name: Test Docker Container Execution
        run: |
          echo "Starting container test..."
          docker run -d \
            -p 8080:8080 \
            --name devops-test \
            --health-cmd="curl -f http://localhost:8080/health || exit 1" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "Waiting for container to be healthy..."
          sleep 20
          
          if docker ps | grep -q devops-test; then
            echo "✓ Container is running successfully"
            docker logs devops-test | tail -20
          else
            echo "✗ Container failed to start"
            docker logs devops-test
            exit 1
          fi
          
          docker stop devops-test
          docker rm devops-test

  summary:
    name: DevOps Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ci, testing, delivery]
    if: always()
    
    steps:
      - name: Pipeline Completion Report
        run: |
          echo "=== DevOps Pipeline Summary ==="
          echo "Workflow: Full CI/CD Pipeline"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Docker Image: ${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo ""
          echo "Stages Completed:"
          echo "✓ CI (Build & Build tests)"
          echo "✓ Testing (Integration tests)"
          echo "✓ Delivery (Docker build & validation)"
          echo ""
          echo "Pipeline Execution Date: $(date)"
