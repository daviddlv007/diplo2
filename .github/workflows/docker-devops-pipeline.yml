name: DevOps Pipeline with Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build application
        run: dotnet build --configuration Release --no-restore
      
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker Image
        run: |
          docker build -t miapp-devops:latest -t miapp-devops:${{ github.sha }} .
        working-directory: .
      
      - name: Verify Docker Image
        run: |
          docker images | grep miapp-devops
          docker inspect miapp-devops:latest
      
      - name: Test Docker Container
        run: |
          docker run -d -p 8080:8080 --name test-container miapp-devops:latest
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' test-container)" = "true" ]; then
            echo "✓ Container is running successfully"
          else
            echo "✗ Container failed to start"
            docker logs test-container
            exit 1
          fi
          docker stop test-container
          docker rm test-container

  push-docker-image:
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Tag Docker Image
        run: |
          docker build -t miapp-devops:${{ github.sha }} -t miapp-devops:latest .
      
      - name: Display Build Info
        run: |
          echo "Docker Image built successfully"
          echo "Image Tag: miapp-devops:${{ github.sha }}"
          echo "Latest Tag: miapp-devops:latest"
          docker images | grep miapp-devops
